# Local build. Configuration lives in .env (copy from .env.example), data in ./data.
# For the prebuilt GHCR image use docker-compose.ghcr.yml instead.
name: vevor-weatherbridge

services:
  vevor-weatherbridge:
    build: .
    image: vevor-weatherbridge:local
    container_name: vevor-weatherbridge
    restart: unless-stopped
    env_file: .env
    # Hardening: the app runs as uid 10001 with only CAP_NET_BIND_SERVICE (see docker-entrypoint.sh).
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # HTTP on port 80
      - CHOWN              # entrypoint: hand ./data over to the app user
      - SETUID             # entrypoint: drop root
      - SETGID
    volumes:
      - ./data:/data
    labels:
      wud.watch: "false"   # locally built image, nothing to watch in a registry
    networks:
      lan:
        ipv4_address: ${CONTAINER_IP:-192.168.1.200}

networks:
  lan:
    # Existing ipvlan/macvlan network created by UnRAID (Settings → Docker), e.g. br0.
    name: ${DOCKER_NETWORK:-br0}
    external: true
