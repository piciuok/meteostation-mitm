name: ESPHome compatibility

# Checks the ESPHome Native API backend against the aioesphomeapi versions that matter:
#   pinned    - our requirements.txt
#   ha-stable - what the latest Home Assistant release uses to talk to this container
#   ha-dev    - what the next Home Assistant release will use
#   esphome   - what the latest ESPHome release (dashboard/CLI) uses
#   latest    - newest aioesphomeapi on PyPI (early warning, server code built against it)
# The tests start our ESPHome server and connect with the real aioesphomeapi client.
# Triggered weekly, manually, on changes to the ESPHome code, and by upstream-watch.yml
# whenever a new Home Assistant / ESPHome / aioesphomeapi release is detected.

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC (safety net)
  workflow_dispatch:
  workflow_call:
    inputs:
      reason:
        description: Why the run was triggered (shown in the summary and in the issue)
        type: string
        default: ""
      report:
        description: Open/update an issue when the run fails
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "weatherbridge/esphome.py"
      - "tests/test_esphome.py"
      - "requirements*.txt"
      - "scripts/esphome_versions.py"
      - ".github/workflows/esphome-compat.yml"

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [pinned, ha-stable, ha-dev, esphome, latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Resolve aioesphomeapi version
        id: ver
        env:
          TARGET: ${{ matrix.target }}
          REASON: ${{ inputs.reason }}
        run: |
          v=$(python scripts/esphome_versions.py "$TARGET")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "### $TARGET: aioesphomeapi $v" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REASON" ]; then echo "Trigger: $REASON" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Install
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pip install -r requirements-dev.txt
          pip install "aioesphomeapi==$VERSION"
          pip show aioesphomeapi | head -2
      - name: ESPHome backend tests
        run: pytest -q tests/test_esphome.py
      - name: Full test suite
        run: pytest -q

  report:
    needs: compat
    if: failure() && (github.event_name == 'schedule' || inputs.report)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ inputs.reason }}
        run: |
          title="ESPHome compatibility check failed"
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" != "true" ]; then
            echo "::warning::Issues are disabled in this repository; not opening an issue. See $RUN_URL"
            echo "Issues are disabled in this repository, so no issue was opened. Enable them in Settings → General → Features to get failure reports." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          num=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number -q '.[0].number')
          body="The ESPHome compatibility run failed: $RUN_URL"
          if [ -n "$REASON" ]; then body="$body"$'\n\n'"Trigger: $REASON"; fi
          if [ -n "$num" ]; then
            gh issue comment "$num" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
